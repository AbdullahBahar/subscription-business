<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abdullah Business</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; }
    html, body {
      font-family: 'Open Sans', sans-serif;
      height: 100%;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      overflow-x: hidden;
      color: white;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
      perspective: 1000px;
    }

    .panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      transform-style: preserve-3d;
      animation: swingPanel 10s infinite alternate; /* Changed to swingPanel and added alternate */
    }

    @keyframes swingPanel {
      0% { transform: translateX(-50px) rotateY(-10deg); } /* Start with a slight rotation to the left */
      100% { transform: translateX(50px) rotateY(10deg); } /* End with a slight rotation to the right */
    }

    .pricing-plan {
      background: linear-gradient(145deg, #1e3c72, #2a5298);
      border-radius: 20px;
      padding: 30px;
      width: 300px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
      transition: transform 0.6s ease, box-shadow 0.6s ease;
      transform-style: preserve-3d;
      transform: rotateY(0deg);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .pricing-plan:hover {
      transform: rotateY(180deg) scale(1.05);
      box-shadow: 0 35px 70px rgba(255, 255, 255, 0.3);
    }

    .pricing-img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .pricing-header {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .pricing-features {
      list-style: none;
      padding: 0;
      margin: 0 0 20px 0;
      text-align: left;
    }

    .pricing-features-item {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .pricing-price {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 20px 0;
      background: linear-gradient(to right, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .pricing-button {
      display: inline-block;
      padding: 12px 30px;
      border-radius: 30px;
      font-weight: 700;
      text-transform: uppercase;
      text-decoration: none;
      background: linear-gradient(to right, #00f2fe, #4facfe);
      color: #fff;
      box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .pricing-button:hover {
      transform: scale(1.1);
      box-shadow: 0 15px 30px rgba(0, 242, 254, 0.4);
    }
  </style>
</head>
<body>
  <div class="panel pricing-table">

    <div class="pricing-plan">
      <img src="per.jpg" alt="Personal Plan" class="pricing-img">
      <h2 class="pricing-header">Personal</h2>
      <ul class="pricing-features">
        <li class="pricing-features-item">Up to 100 GB storage</li>
        <li class="pricing-features-item">Backup every 24 hours</li>
      </ul>
      <span class="pricing-price">Free</span>
      <a href="#" class="pricing-button">Sign Up</a>
    </div>

    <div class="pricing-plan">
      <img src="small.jpg" alt="Small Team Plan" class="pricing-img">
      <h2 class="pricing-header">Small Team</h2>
      <ul class="pricing-features">
        <li class="pricing-features-item">1 TB of storage</li>
        <li class="pricing-features-item">Priority customer support</li>
      </ul>
      <span class="pricing-price">$150</span>
      <a href="#" class="pricing-button">Free Trial</a>
    </div>

    <div class="pricing-plan">
      <img src="first.jpg" alt="Enterprise Plan" class="pricing-img">
      <h2 class="pricing-header">Enterprise</h2>
      <ul class="pricing-features">
        <li class="pricing-features-item">Unlimited storage</li>
        <li class="pricing-features-item">24/7 dedicated support</li>
      </ul>
      <span class="pricing-price">$400</span>
      <a href="#" class="pricing-button">Free Trial</a>
    </div>

  </div>
</body>
</html>
